name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check required files
        run: |
          for f in package.json capacitor.config.json icon-512.png index.html app4.js; do
            [ -f "$f" ] || { echo "::error::Missing file in repo root: $f"; exit 1; }
          done

      - name: Install Capacitor
        run: |
          npm install
          V=$(node -p "try{require('./node_modules/@capacitor/core/package.json').version.split('.')[0]}catch(e){''}")
          [ -z "$V" ] && V=6
          echo "Capacitor major: $V"
          npm install @capacitor/core@$V @capacitor/cli@$V @capacitor/android@$V @capacitor/push-notifications@$V @capacitor/local-notifications@$V @capacitor/app@$V @capacitor/camera@$V @capacitor/geolocation@$V
          npx cap --version

      - name: Copy web files into www
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-*.png www/ 2>/dev/null || true
          cp *.js *.css www/ 2>/dev/null || true
          [ -d assets ] && cp -r assets www/ || true
          ls -la www

      - name: Add Android project
        run: npx cap add android

      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/><uses-feature android:name="android.hardware.camera" android:required="false"/><uses-feature android:name="android.hardware.microphone" android:required="false"/></manifest>#' $M
          sed -i '0,/<activity/s#<activity#<activity android:showWhenLocked="true" android:turnScreenOn="true"#' $M
          grep -c "RECORD_AUDIO" $M
          grep -c "showWhenLocked" $M

      - name: Firebase push config (optional)
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied"
          else
            echo "::warning::google-services.json not found in repo root - push notifications disabled"
          fi

      - name: App icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          if command -v magick >/dev/null; then CONV="magick"; else CONV="convert"; fi
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              $CONV icon-512.png -resize ${s}x${s} $R/mipmap-$d/$n.png
            done
          done

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SyriaChat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
