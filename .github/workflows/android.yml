name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check required files
        run: |
          for f in package.json capacitor.config.json icon-512.png index.html; do
            [ -f "$f" ] || { echo "::error::Missing file in repo root: $f"; exit 1; }
          done

      - name: Install Capacitor
        run: npm install

      - name: Copy web files into www
        run: |
          mkdir -p www
          cp index.html firebase-config.js sw.js manifest.webmanifest icon-*.png www/ 2>/dev/null || true
          [ -d assets ] && cp -r assets www/ || true

      - name: Add Android project
        run: npx cap add android

      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' $M

      - name: App icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-512.png -resize ${s}x${s} $R/mipmap-$d/$n.png
            done
          done

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SyriaChat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
