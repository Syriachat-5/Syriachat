let AC;function beep(f,d,n){if(X.nosnd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*(d+.08);o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}}catch(e){}}
document.addEventListener('click',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}if(D.notif&&'Notification' in window&&Notification.permission=='default')Notification.requestPermission()},{once:true});

V.newchan=function(){return hd2('قناة جديدة','updates')+`<div class="pad"><input id="cnm" placeholder="اسم القناة"><button class="btn" onclick="mkChan()">إنشاء القناة</button><small class="mu">أي شخص يستطيع متابعة قناتك، وأنت فقط من ينشر فيها.</small></div>`};
async function mkChan(){const n=$('cnm').value.trim();if(!n)return toast('اكتب اسم القناة');try{const r=await fs.collection('channels').add({name:n,owner:D.me,followers:[],posts:[],t:Date.now()});nav('chan',{ch:r.id})}catch(e){toast('تعذر إنشاء القناة')}}
V.chan=function(){const c=(D.channels||[]).find(x=>x.id==S.ch);if(!c)return V.updates();const own=c.owner==D.me,fol=(c.followers||[]).includes(D.me);
return hd2(esc(c.name),'updates')+`<div id="msgs" class="msgs" style="background:${wpc()}">${(c.posts||[]).map(p=>`<div class="b"${own?` onclick="delPost('${c.id}','${p.id}')"`:''}>${esc(p.text)}<em>${tm(p.t)}</em></div>`).join('')||'<p class="c mu">لا توجد منشورات بعد</p>'}</div>`+(own?`<div class="cp"><input id="ti" placeholder="اكتب منشوراً للمتابعين" onkeydown="if(event.key=='Enter')postChan('${c.id}')"><button onclick="postChan('${c.id}')">➤</button></div>`:`<div class="cp" style="justify-content:center"><button class="btn" style="background:var(--pr);color:#fff;font-size:16px;padding:11px 30px" onclick="followChan('${c.id}')">${fol?'إلغاء المتابعة':'＋ متابعة'}</button></div>`)};
function postChan(id){const e=$('ti'),t=e&&e.value.trim();if(!t)return;e.value='';fs.doc('channels/'+id).update({posts:FV.arrayUnion({id:uid(),text:t,t:Date.now()})}).catch(()=>toast('تعذر النشر'))}
async function delPost(id,pid){if(!confirm('حذف هذا المنشور؟'))return;try{const r=fs.doc('channels/'+id),d=(await r.get()).data();await r.update({posts:(d.posts||[]).filter(p=>p.id!=pid)})}catch(e){toast('تعذر الحذف')}}

async function mkComm(){const n=$('gn').value.trim(),sel=[...document.querySelectorAll('.gc:checked')].map(x=>x.value);if(!n||!sel.length)return toast('اكتب اسم المجتمع واختر عضواً');
try{const r=await fs.collection('chats').add({type:'group',comm:true,name:n,members:[D.me,...sel],msgs:[{id:uid(),from:D.me,text:'تم إنشاء المجتمع',t:Date.now()}],gone:{}});nav('chat',{chat:r.id})}catch(e){toast('تعذر الإنشاء')}}

const clrSet=()=>LJ('tgclr');
const callLog=()=>{const mp=new Map();[...CL1,...CL2].forEach(d=>mp.set(d.id,d));const h=clrSet(),a=[...mp.values()].filter(d=>!h.includes(d.id)&&d.t).sort((x,y)=>y.t-x.t),out=[];
a.forEach(d=>{const peer=d.from==D.me?d.to:d.from,miss=d.to==D.me&&!d.answer,l=out[out.length-1];if(l&&l.peer==peer&&l.type==d.type&&l.miss==miss&&l.out==(d.from==D.me))l.n++;else out.push({peer,type:d.type,miss,out:d.from==D.me,t:d.t,n:1,ids:[d.id]});if(out.length&&out[out.length-1].ids.indexOf(d.id)<0)out[out.length-1].ids.push(d.id)});return out};
function clrCalls(){const ids=[...CL1,...CL2].map(d=>d.id);LW('tgclr',clrSet().concat(ids));render();toast('تم مسح السجل')}

const favs=()=>LJ('tgfav');
function togFav(id){const a=favs();LW('tgfav',a.includes(id)?a.filter(x=>x!=id):a.concat(id));render()}

${lg.length?`<div class="sech"><span>الحديثة</span></div>${lg.slice(0,40).map(l=>{const u=U(l.peer)||{name:'محذوف'};return`<div class="row" onclick="callUser('${l.peer}','${l.type}')"><div class="av" data-u="${l.peer}">${ini(u.name)}</div><div class="t"><b style="${l.miss?'color:#e5484d':''}">${esc(u.name)}${l.n>1?` (${l.n})`:''}</b><p><span style="color:${l.miss?'#e5484d':'#2e9e5b'}">${l.out?'↗':'↙'}</span> ${new Date(l.t).toLocaleString('ar',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'})}</p></div><span class="ib">${ic(l.type=='video'?'video':'phone')}</span></div>`}).join('')}`:''}
